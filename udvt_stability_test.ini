name: Build UDVT-CLASS Solver

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgcc-10-dev gfortran

      - name: Compile UDVT-CLASS
        run: |
          cd external/class_v3.0_udvt
          make clean
          make -j4

      - name: Run Stability Benchmarks
        run: |
          ./class udvt_stability_test.ini
          
