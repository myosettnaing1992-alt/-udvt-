name: Build UDVT-CLASS Patch

on: [push]

jobs:
  build-class:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran libextcalc-perl

      - name: Compile CLASS with UDVT Modules
        run: |
          cd class_patch/
          make clean
          make -j4

      - name: Verify Execution
        run: ./class_patch/class class_patch/explanatory.ini
        
