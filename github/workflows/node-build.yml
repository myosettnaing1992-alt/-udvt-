name: UDVT Physics Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Force the use of Node 24 for the runner environment
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v4 uses Node 20+, compatible with the Node 24 override
      - name: Checkout Code
        uses: actions/checkout@v4

      # v5 is the latest version for Python setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Physics Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy astropy matplotlib openpyxl

      - name: UDVT Syntax & Logic Check
        run: |
          # Compiles all python files to check for hidden syntax errors
          python -m py_compile *.py
          echo "Physics Core Validation Complete."
          
