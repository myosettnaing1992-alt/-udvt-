name: Upload Python Package

on:
  release:
    # Triggered automatically when you publish a new release in GitHub
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Build Release Distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Using Python 3.11 for maximum stability with UDVT numerical calculations
          python-version: "3.11"

      - name: Build Source and Wheel Distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Store Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # MANDATORY: This permission is required for Trusted Publishing (OIDC)
      id-token: write

    # It is strongly recommended to set up a 'pypi' environment in your Repo Settings
    environment:
      name: pypi
      url: https://pypi.org/project/udvt/

    steps:
      - name: Download Built Distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        # Using the official PyPA action for secure, token-less publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          
