name: UDVT Theoretical Consistency CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        # Utilizing caching for faster subsequent runs
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure testing dependencies are present
        pip install numpy scipy pandas matplotlib

    - name: Run Theory Stability Tests
      # This executes your unittest suite to verify the Myo Limit (beta <= 0.01)
      run: |
        python -m unittest discover tests/
        
