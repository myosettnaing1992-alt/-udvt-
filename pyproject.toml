[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udvt-suite"
version = "3.0.0"
description = "Unified Dynamic Vacuum Theory Computational Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Myo Sett Naing"}
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0"
]

[tool.setuptools]
packages = ["tests"]
